{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'attendance/css/style.css' %}">
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white p-3 vh-100" style="width: 240px;">
    <h4 class="text-center mb-4">Employee</h4>

    <ul class="nav flex-column gap-2">
        <li class="nav-item">
            <a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
        </li>
        <li class="nav-item">
           <a class="nav-link text-white" href="{% url 'attendance_history' %}">
    Attendance History
</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="#">Apply Leave</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="#">Profile</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-danger" href="#">Logout</a>
        </li>
    </ul>
</div>
    <!-- Main Content -->
    <div class="flex-grow-1">

        <!-- Top Navbar -->
        <nav class="navbar navbar-light bg-light px-4">
            <span class="navbar-brand">Welcome, {{ request.user.username }}</span>
            <div>
                🔔
                <div class="dropdown d-inline">
                    <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                        Profile
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">View Profile</a></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="p-4">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('hoursChart');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Mon','Tue','Wed','Thu','Fri'],
            datasets: [{
                label: 'Hours',
                data: [8,7,9,6,8],
                backgroundColor: 'rgba(54, 162, 235, 0.6)'
            }]
        }
    });
</script>
</body>
</html>
